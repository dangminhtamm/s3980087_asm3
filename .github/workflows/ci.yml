name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    name: Required quality gate
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm ci --prefix infra
      - run: npm run verify
      - if: always()
        run: docker compose down

  performance-budget:
    name: Required 50-user performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - run: npm run local:up
      - name: Run 50-user performance gate
        run: K6_ENFORCE_THRESHOLDS=false TEST_DURATION=20s npm run perf:50
      - run: node scripts/check-performance-budget.mjs load/reports/k6-50.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-50-users
          path: load/reports/
      - if: always()
        run: docker compose down --volumes
