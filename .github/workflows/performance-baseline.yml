name: Performance baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - run: npm run local:up
      - name: Run 50, 200 and 500 concurrent-user profiles
        run: npm run perf:baseline
      - run: node scripts/check-performance-budget.mjs load/reports/k6-50.json load/reports/k6-200.json load/reports/k6-500.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudfleet-performance-baseline
          path: |
            load/reports/
            docs/performance-baseline.md
      - if: always()
        run: docker compose down --volumes
