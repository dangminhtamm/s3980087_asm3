name: cloudfleet-local

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath ./data -disableTelemetry
    working_dir: /home/dynamodblocal
    # The official image otherwise cannot always initialize a fresh named volume.
    user: root
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --output /dev/null http://localhost:8000/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  s3:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: cloudfleet
      MINIO_ROOT_PASSWORD: cloudfleet-local-secret
      MINIO_REGION_NAME: ap-southeast-1
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  local-init:
    image: cloudfleet-api-local
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/scripts/local-bootstrap.js']
    environment: &backend-environment
      NODE_ENV: development
      PORT: '3000'
      AUTH_MODE: disabled
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: cloudfleet
      AWS_SECRET_ACCESS_KEY: cloudfleet-local-secret
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_NAME: cloudfleet-local-operations
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_DELIVERY_PROOF_BUCKET: cloudfleet-local-delivery-proofs
      S3_ANALYTICS_BUCKET: cloudfleet-local-analytics
      ANALYTICS_STATE_MACHINE_ARN: ''
      WEBSOCKET_PUBLIC_URL: ''
      WEBSOCKET_MANAGEMENT_ENDPOINT: ''
      TRACKING_BASE_URL: http://localhost:5173
      GEOCODING_PROVIDER: nominatim
      GEOCODING_BASE_URL: https://nominatim.openstreetmap.org
      GEOCODING_USER_AGENT: CloudFleet/0.1
      GEOCODING_MIN_INTERVAL_MS: '1000'
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-straight-line}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://router.project-osrm.org}
      ROUTING_ORIGIN_LAT: ${ROUTING_ORIGIN_LAT:-10.7769}
      ROUTING_ORIGIN_LNG: ${ROUTING_ORIGIN_LNG:-106.7009}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@cloudfleet.local}
      OBSERVABILITY_ENVIRONMENT: local
      METRICS_SERVICE_NAME: cloudfleet-api
      METRICS_NAMESPACE: CloudFleet/Observability
    depends_on:
      dynamodb:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: 'no'

  backend:
    image: cloudfleet-api-local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-environment
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      local-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  dynamodb-data:
  s3-data:
